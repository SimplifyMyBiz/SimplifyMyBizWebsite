<header class="site-header">
  <div class="wrap bar">
    <a class="logo" href="{{ "/" | relURL }}" aria-label="{{ site.Title }} home">
      {{ partial "logo.html" . }}
    </a>
    <nav class="nav" aria-label="Main">
      {{ range site.Menus.main }}<a href="{{ .URL }}">{{ .Name }}</a>{{ end }}
    </nav>
    <a class="btn btn-sm" href="#contact">Talk to us</a>
  </div>
</header>
