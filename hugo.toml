baseURL = "https://simplifymy.biz/"
locale = "en-US"
title = "SimplifyMyBiz"
theme = "smb"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "rss"]

[params]
  description = "SimplifyMyBiz handles the tech so you can focus on your business. Google Workspace, email, AI, unhackable websites and daily backups — set up right and managed for you."
  tagline = "Tech handled. Business focused."
  # Contact details shown in the header CTA, contact section and footer.
  email = "hello@simplifymy.biz"
  phone = "650.260.4656"
  bookingURL = ""        # e.g. a Google Calendar appointment page; falls back to mailto
  formEndpoint = ""      # Cloud Run URL for the contact form; empty = mailto link only
  # Brand colors (any CSS color). The theme derives everything else.
  brandColor = "#0f2a44"
  accentColor = "#14b8a6"

[menus]
  [[menus.main]]
    name = "Services"
    pageRef = "/#services"
    weight = 10
  [[menus.main]]
    name = "How it works"
    pageRef = "/#how"
    weight = 20
  [[menus.main]]
    name = "FAQ"
    pageRef = "/#faq"
    weight = 30

[minify]
  minifyOutput = true

# ---- Deploy: `hugo deploy` (see README) ----
[deployment]
  [[deployment.targets]]
    name = "production"
    URL = "gs://smb-site-simplifymybiz"

  [[deployment.matchers]]
    pattern = "^.+\\.(css|js|svg|png|jpg|jpeg|webp|avif|woff2|ico)$"
    cacheControl = "public, max-age=31536000, immutable"
    gzip = true

  [[deployment.matchers]]
    pattern = "^.+\\.(html|xml|json|txt)$"
    cacheControl = "public, max-age=300"
    gzip = true
