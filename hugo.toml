baseURL = "https://simplifymy.biz/"
locale = "en-US"
title = "SimplifyMyBiz"
theme = "smb"
enableRobotsTXT = true
disableHugoGeneratorInject = true
disableKinds = ["taxonomy", "term", "rss"]

[params]
  description = "SimplifyMyBiz handles the tech so you can focus on your business. Google Workspace, email, AI, fast websites on Cloudflare and locked daily backups — set up right, managed for you and always owned by you."
  tagline = "Tech handled. Business focused."
  # Contact details shown in the header CTA, contact section and footer.
  email = "hello@simplifymy.biz"
  phone = ""  # leave empty to hide; we lead with email
  bookingURL = ""        # e.g. a Google Calendar appointment page; falls back to mailto
  formEndpoint = ""      # Cloud Run URL for the contact form; empty = mailto link only
  # Brand colors (any CSS color). The theme derives everything else.
  brandColor = "#e4ebfb"
  accentColor = "#3051ff"

[menus]
  [[menus.main]]
    name = "Services"
    url = "#services"
    weight = 10
  [[menus.main]]
    name = "How it works"
    url = "#how"
    weight = 20
  [[menus.main]]
    name = "FAQ"
    url = "#faq"
    weight = 30

[minify]
  minifyOutput = true

